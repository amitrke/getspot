# This isn't a real multi-package workspace, but newer pnpm requires a
# `packages` field whenever pnpm-workspace.yaml exists at all. This file
# only exists to hold overrides that need to live here (see below).
packages:
  - .

# Locally, pnpm just warns and skips these packages' install/postinstall
# scripts. Google Cloud Build's deploy environment treats the same
# situation as a fatal ERR_PNPM_IGNORED_BUILDS error, so they must be
# explicitly allow-listed to run their build scripts.
#
# We have to declare this both ways: our own pnpm (10.x, used locally and
# in CI) reads the old `onlyBuiltDependencies` list, but Google Cloud
# Build's deploy-time pnpm is already on 11.x, which removed that key in
# favor of the `allowBuilds` map — an unrecognized-but-harmless key to the
# older pnpm. Keep both in sync until everything is on pnpm 11.
onlyBuiltDependencies:
  - '@firebase/util'
  - protobufjs
  - unrs-resolver

allowBuilds:
  '@firebase/util': true
  protobufjs: true
  unrs-resolver: true

# Pins/upgrades for transitive dependencies. Some entries (e.g. @types/node,
# content-type, baseline-browser-mapping) pin to an older release because
# Google Cloud Build's deploy environment enforces a pnpm minimumReleaseAge
# policy that rejects packages published within roughly the last 24h, so a
# routine `pnpm install` shouldn't silently pick up a too-fresh patch and
# break deploys. The rest bump vulnerable transitive deps (pulled in by
# firebase-tools, jest, eslint, firebase-functions-test) to patched versions
# per `pnpm audit`. Regenerate with `pnpm audit --fix` when new advisories
# show up, then re-add the comments this file carries (the command doesn't
# preserve them).
#
# NOT overridden: stream-json (GHSA-528h-pc64-c93x) and ts-deepmerge
# (GHSA-87mf-gv2c-c62c). Both fixed versions are breaking major bumps that
# their consumers don't support even in their latest release:
#   - firebase-tools requires stream-json@^1.7.3 and does
#     require("stream-json/filters/Pick"), a path that only exists in the
#     1.x layout. Fix needs >=3.5.0. Breaks `firebase emulators:exec`
#     outright (MODULE_NOT_FOUND).
#   - firebase-functions-test@3.5.0 (latest) requires ts-deepmerge@^2.0.1
#     and calls it as `ts_deepmerge_1.default(...)`. Fix (>=8.0.0) renamed
#     the export to a named `merge`, so `.default` is undefined and every
#     test using firebase-functions-test's v2 CloudEvent helpers throws.
# Both are suppressed via functions/osv-scanner.toml instead — revisit once
# firebase-tools / firebase-functions-test bump their own dependency.
#
# uuid is pinned to the 11.x line, not just ">=11.1.1": uuid dropped its CJS
# build entirely starting at v12 (ESM-only), and gaxios/google-auth-library
# (pulled in transitively by firebase-admin, in production, not just tests)
# call `require("uuid")`. Letting the resolver pick latest (14.x) throws
# ERR_REQUIRE_ESM at runtime. 11.1.1 has both the CVE fix and a CJS export.
overrides:
  '@types/node': ^22.0.0
  baseline-browser-mapping: 2.11.13
  content-type: 2.0.0
  '@opentelemetry/core@<2.8.0': '>=2.8.0'
  csv-parse@<7.0.2: '>=7.0.2'
  js-yaml@>=3.0.0 <3.15.2: '>=3.15.2'
  js-yaml@>=4.0.0 <4.3.2: '>=4.3.2'
  qs@>=2.2.5 <6.16.0: '>=6.16.0'
  qs@>=6.14.2 <=6.15.3: '>=6.16.0'
  uuid@<11.1.1: ^11.1.1
