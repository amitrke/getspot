name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'web/**'
      - 'main/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - 'docs/hosting/**'
      - 'firebase.json'
jobs:
  build_and_deploy_app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter build web
      - name: Setup deep links for Universal Links / App Links
        run: |
          echo "Setting up Universal Links / App Links..."
          mkdir -p build/web/.well-known
          cp docs/hosting/apple-app-site-association build/web/.well-known/
          cp docs/hosting/assetlinks.json build/web/.well-known/
          echo "✅ Deep link files copied"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GETSPOT01 }}
          channelId: live
          projectId: getspot01
          target: app
  build_and_deploy_main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: main/package-lock.json
      - run: npm ci
        working-directory: main
      - run: npm run build
        working-directory: main
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GETSPOT01 }}
          channelId: live
          projectId: getspot01
          target: main
